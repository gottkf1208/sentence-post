          for (var col = 0; col < moduleCount; col += 1) {

          }

        setupTypeNumber(test);

        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);

      mapData(_dataCache, maskPattern);

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

        } else {

        } else {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('이 브라우저에서는 기기 보관을 사용할 수 없어요. Chrome이나 Edge로 열어 주세요.'));const r=indexedDB.open('sentence-post-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('entries',{keyPath:'id'});r.result.createObjectStore('tasks',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('다른 창의 문장 우체국을 닫고 다시 열어 주세요.'))})}
function dbRun(store,mode,work){return new Promise((resolve,reject)=>{if(!state.db)return reject(new Error('기기 보관함이 준비되지 않았어요.'));const tx=state.db.transaction(store,mode);let req;try{req=work(tx.objectStore(store))}catch(e){reject(e);return}tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('보관이 취소되었어요.'))})}

function dailyIndex(date){const parts=/^\d{4}-(\d{2})-(\d{2})$/.exec(date);if(!parts)return 0;const m=Number(parts[1]),d=Number(parts[2]);if(m<1||m>12||d<1||d>31)return 0;const days=[31,28,31,30,31,30,31,31,30,31,30,31];return days.slice(0,m-1).reduce((a,b)=>a+b,0)+Math.min(d,days[m-1])-1}

function sameTask(a,b){return ['grade','term','title','skill','text','word','meaning','question','source','minutes'].every(k=>a[k]===b[k])}
async function decodePhoto(file){if(file.size>20*1024*1024)throw new Error('20MB 이하의 사진을 골라 주세요.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WebP 사진을 골라 주세요.');let bitmap;try{bitmap=await createImageBitmap(file)}catch{throw new Error('사진을 읽을 수 없어요. JPG나 PNG로 다시 저장해 주세요.')}if(!bitmap.width||!bitmap.height||bitmap.width*bitmap.height>100000000){bitmap.close();throw new Error('사진 크기가 너무 커요. 줄인 사진을 골라 주세요.')}const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bitmap,0,0,c.width,c.height);bitmap.close();return new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(new Error('사진 처리에 실패했어요.')),'image/jpeg',.82))}
let photoSequence=0;
async function loadPhoto(e){const seq=++photoSequence;state.photo=null;const file=e.target.files[0];if(!file)return;$('#save-record').disabled=true;try{const blob=await decodePhoto(file);if(seq!==photoSequence||state.view!=='write')return;state.photo=blob;$('#photo-preview').src=imageURL(blob);$('#photo-preview').hidden=false;toast('사진을 골랐어요. 아래에 나만의 문장과 생각을 남겨 주세요.')}catch(err){toast(err.message);e.target.value=''}finally{if(seq===photoSequence&&$('#save-record'))$('#save-record').disabled=!state.db}}
async function saveRecord(e){e.preventDefault();if(state.busy)return;if(!state.photo)return toast('먼저 필사한 사진을 골라 주세요.');const answer=$('#word-answer').value.trim(),reflection=$('#reflection').value.trim();if(!answer||!reflection)return toast('나만의 문장과 생각 한 줄을 남겨 주세요.');state.busy=true;$('#save-record').disabled=true;const before=unlocked(),photo=state.photo;try{const entry={id:uid(),created:new Date().toISOString(),date:day(),task:cleanTask(state.task),photo,answer,reflection};await dbRun('entries','readwrite',s=>s.add(entry));state.photo=null;await refresh();const after=unlocked();state.view='archive';render();if(after>before)showArrival(after-1);else modal(`<div class="card-detail">${sticker(3)}<h2>편지가 도착했어요!</h2><p>오늘의 사진과 생각을 우편함에 잘 보관했어요.<br>${after===100?'앞으로도 나만의 이야기를 계속 쌓아 보세요.':'새로운 문장에 도전하면 다음 친구를 만날 수 있어요.'}</p><button class="primary" data-action="close">내 우편함 보기</button></div>`)}catch(err){toast('보관하지 못했어요. 저장 공간을 확인하고 다시 시도해 주세요.');if($('#save-record'))$('#save-record').disabled=false}finally{state.busy=false}}
function entryForCard(index){const seen=new Set(),unique=[];for(const e of [...state.entries].reverse()){const key=taskKey(e.task);if(!seen.has(key)){seen.add(key);unique.push(e)}}return unique[index]}

function worksheet(t){const pages=printPages(t);return pages.map((text,i)=>'<article class="worksheet length-sheet"><div class="print-heading"><div><div style="font-size:10px;letter-spacing:2px">SENTENCE POST CLUB</div><h1>문장 우체국 · '+esc(t.title)+'</h1></div><div style="font-size:11px">'+t.grade+'학년 '+t.term+'학기<br>'+t.minutes+'분 활동 · '+(i+1)+' / '+pages.length+'쪽</div></div><div class="print-meta">이름 ____________________　날짜 ____________________</div><section><h3>01. 읽고, 아래 줄에 천천히 옮겨 써요.</h3><div class="print-passage">'+esc(text)+'</div><p class="print-source">출처: '+esc(t.source)+'</p><div class="copy-lines">'+Array.from({length:Math.max(5,Math.ceil(text.length/27)+2)},()=>'<div></div>').join('')+'</div></section>'+(i===pages.length-1?'<section><h3>02. 낱말을 넣은 내 문장</h3><p style="font-size:11px"><strong>'+esc(t.word)+'</strong> · '+esc(t.meaning)+'</p><div class="answer-lines" style="height:30px"></div></section><section><h3>03. 생각 한 줄</h3><p style="font-size:11px">'+esc(t.question)+'</p><div class="answer-lines" style="height:58px"></div></section>':'')+'<div class="print-footer">□ 띄어쓰기와 문장 부호를 확인했어요.　완성한 종이는 사진으로 보관해요.</div></article>').join('')}

function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}

function dataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
async function backup(){if(!state.db)return toast('보관함을 사용할 수 없어요.');toast('사진을 포함한 백업 파일을 만들고 있어요.');try{await refresh();const entries=[];for(const e of state.entries)entries.push({...e,photo:await dataURL(e.photo)});downloadJSON({app:'sentence-post',version:1,created:new Date().toISOString(),entries,tasks:state.custom,nickname:setting('nickname','문장 배달부')},`문장우체국_백업_${day()}.json`);toast('백업 파일을 저장했어요. 사진이 들어 있으니 개인적으로 보관해 주세요.')}catch{toast('백업 파일을 만들지 못했어요. 다시 시도해 주세요.')}}
function blobFromDataURL(s){if(typeof s!=='string'||s.length>28000000||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s))throw new Error('사진 형식이 올바르지 않아요.');const [head,body]=s.split(','),binary=atob(body),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new Blob([bytes],{type:head.slice(5,head.indexOf(';'))})}
async function importBackup(file){if(!file)return;if(file.size>150*1024*1024)throw new Error('150MB 이하의 백업 파일을 선택해 주세요.');const obj=JSON.parse(await file.text());if(obj.app!=='sentence-post'||obj.version!==1||!Array.isArray(obj.entries)||obj.entries.length>2000||!Array.isArray(obj.tasks)||obj.tasks.length>2000)throw new Error('문장 우체국 백업 파일이 아니에요.');const imported=[];for(const e of obj.entries){if(!validTask(e.task)||typeof e.id!=='string'||e.id.length>100||typeof e.created!=='string'||!Number.isFinite(Date.parse(e.created))||typeof e.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||typeof e.answer!=='string'||e.answer.length>160||typeof e.reflection!=='string'||e.reflection.length>300)throw new Error('일부 기록의 형식이 올바르지 않아요.');const photo=await decodePhoto(blobFromDataURL(e.photo));imported.push({id:e.id,created:e.created,date:e.date,task:cleanTask(e.task),photo,answer:e.answer,reflection:e.reflection})}if(!obj.tasks.every(validTask))throw new Error('활동 형식이 올바르지 않아요.');const existing=new Set(state.entries.map(e=>e.id)),newEntries=imported.filter(e=>!existing.has(e.id));await new Promise((res,rej)=>{const tx=state.db.transaction(['entries','tasks'],'readwrite');newEntries.forEach(e=>tx.objectStore('entries').add(e));obj.tasks.forEach(t=>{if(!allTasks().some(x=>x.id===t.id))tx.objectStore('tasks').put(cleanTask(t))});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});await refresh();state.view='archive';render();toast(`${newEntries.length}통을 가져왔어요. 기존 기록과 중복되는 편지는 그대로 두었어요.`)}

function share(t){if(!t)return;const base=shareBase();if(!base){modal(`<h2>학생용 주소가 필요해요</h2><p>지금은 이 컴퓨터에서 실행 중이에요. 학생이 QR로 들어오려면 이 프로그램을 올린 웹 주소가 필요합니다.</p><p style="margin-top:12px">선생님 책상에서 실제 프로그램 주소를 입력해 주세요. 학생 사진은 그곳으로 전송되지 않고 학생 기기에 보관돼요.</p><div class="actions"><button class="primary" data-action="export-current">대신 활동 파일 저장</button><button class="secondary" data-nav="teacher">주소 설정하기</button></div>`);state.sharing=t;return}const url=base+'#'+encodePayload(t);state.shareURL=url;state.sharing=t;if(url.length>2100){modal('<h2>활동 파일로 나눠 주세요</h2><p>문장이 길어 QR에 담기 어려워요. 활동 파일을 학생 기기에서 열면 같은 활동을 사용할 수 있어요.</p><div class="actions"><button class="primary" data-action="export-current">활동 파일 저장</button></div>');return}try{const qr=qrcode(0,'M');qr.addData(url);qr.make();modal(`<h2>이 편지를 함께 써요</h2><p>${esc(t.title)} · ${t.grade}학년 ${t.term}학기</p><div class="qr-box">${qr.createSvgTag({cellSize:4,margin:4,scalable:true})}</div><p>학생 기기로 QR을 스캔하면 이 활동이 열려요.<br>사진과 기록은 각 기기에 따로 쌓입니다.</p><div class="code-url">${esc(url)}</div><div class="actions"><button class="primary" data-action="copy-link">링크 복사</button><button class="secondary" data-action="qr-save">QR 저장</button></div>`)}catch{toast('QR을 만들 수 없어요. 활동 파일로 나눠 주세요.')}}

document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;try{if(b.dataset.nav){e.preventDefault();$('#dialog').close();navigate(b.dataset.nav);return}if(b.dataset.length){switchLength(Number(b.dataset.length));return}if(b.dataset.theme){state.albumTheme=b.dataset.theme==='candy'?'candy':'adventure';setSetting('albumTheme',state.albumTheme);render();return}if(b.dataset.group){state.albumGroup=b.dataset.group;state.albumPage=0;render();return}if(b.dataset.albumPage){state.albumPage=Number(b.dataset.albumPage);render();return}if(b.dataset.libraryPage){state.libraryPage=Number(b.dataset.libraryPage);updateLibrary();return}if(b.dataset.task){chooseTask(allTasks().find(t=>t.id===b.dataset.task));return}if(b.dataset.card!==undefined){showCard(Number(b.dataset.card));return}if(b.dataset.record){showRecord(b.dataset.record);return}if(b.dataset.filter){state.collectionFilter=b.dataset.filter;render();return}if(b.dataset.time){clearInterval(state.timer);state.timer=null;state.seconds=Number(b.dataset.time)*60;$('#timer-label').textContent=timerLabel();document.querySelector('[data-action="timer"]').textContent='시작';return}if(b.dataset.photo){const record=state.entries.find(e=>e.id===b.dataset.photo);download(record.photo,`필사_${record.date}.jpg`);return}if(b.dataset.delete){if(!confirm('이 필사 기록을 삭제할까요? 연결된 수집 카드 수도 줄어들 수 있어요. 먼저 백업하는 것을 권장해요.'))return;await dbRun('entries','readwrite',s=>s.delete(b.dataset.delete));await refresh();$('#dialog').close();render();toast('기록을 삭제했어요.');return}switch(b.dataset.action){case'new-source':state.task=emptyTask();navigate('teacher');break;case'source-pack':$('#source-pack-file').click();break;case'date-task':if(!$('#library-date').value)return toast('날짜를 골라 주세요.');chooseTask(TASKS[dailyIndex(state.libraryDate)]);break;case'today-task':state.libraryDate=day();chooseTask(TASKS[dailyIndex(day())]);break;case'close':$('#dialog').close();break;case'help':help();break;case'print':printTask(state.task);break;case'teacher-print':printTask(readTeacher());break;case'share':share(state.task);break;case'teacher-share':share(readTeacher());break;case'task-export':exportTask(readTeacher());break;case'export-current':exportTask(state.sharing);break;case'import-task':$('#task-file').click();break;case'backup':await backup();break;case'restore':$('#restore-file').click();break;case'timer':toggleTimer();break;case'save-settings':{const base=$('#share-base').value.trim();if(base){let url;try{url=new URL(base)}catch{throw new Error('올바른 웹 주소를 입력해 주세요.')}if(!['https:','http:'].includes(url.protocol))throw new Error('http 또는 https 주소를 입력해 주세요.')}setSetting('nickname',$('#nickname').value.trim()||'문장 배달부');setSetting('shareBase',base);toast('설정을 저장했어요.');break}case'copy-link':try{await navigator.clipboard.writeText(state.shareURL);toast('링크를 복사했어요.')}catch{toast('위에 표시된 링크를 선택해 복사해 주세요.')}break;case'qr-save':{const svg=$('.qr-box svg');if(svg)download(new Blob([svg.outerHTML],{type:'image/svg+xml'}),'문장우체국_QR.svg');break}}}catch(err){toast(err.message||'작업을 완료하지 못했어요. 다시 시도해 주세요.')}});
$('#restore-file').onchange=async e=>{try{toast('백업 파일을 확인하고 있어요.');await importBackup(e.target.files[0])}catch(err){toast('가져오지 못했어요. '+err.message)}finally{e.target.value=''}};

window.addEventListener('hashchange',()=>{if(['home','write','collection','archive','teacher'].includes(location.hash.slice(1))){navigate(location.hash.slice(1))}});
function emptyTask(){return {id:'empty',grade:4,term:1,title:'',text:'',originalText:'',word:'',meaning:'',question:'이 글에서 마음에 남은 표현과 그 까닭을 써 보세요.',source:'',skill:'교과서 원문 필사',minutes:20,kind:'textbook',book:'국어',edition:'2022 개정',unit:'',pages:'',author:'',rangeStart:1,rangeEnd:1,verified:false}}
function sourceLines(text){return String(text||'').match(/[^\n]+(?:\n+|$)|\n+/g)||[]}
function sourceRange(text,start,end){const lines=sourceLines(text);return lines.slice(start-1,end).join('')}
function printPages(t){const chunks=[];let rest=String(t.text||'');while(rest.length>350){let cut=rest.lastIndexOf('\n',349)+1;if(cut<180)cut=rest.lastIndexOf(' ',349)+1;if(cut<180)cut=350;chunks.push(rest.slice(0,cut));rest=rest.slice(cut)}if(rest)chunks.push(rest);return chunks}
function isTextbook(t){return t?.kind==='textbook'&&t.verified===true&&validTask(t)}
function allTasks(){return [...TASKS,...state.custom.filter(isTextbook)]}
function baseTask(){return null}
function resolveTask(id){return allTasks().find(t=>t.id===id)}
function adaptTask(t){return t||emptyTask()}
function makeBundle(t){return {...t}}
function taskKey(t){if(t.kind==='textbook'&&t.originalText)return [t.grade,t.term,t.book,t.edition,t.unit,t.pages,t.originalText.replace(/\s+/g,' ').trim()].join('|');if(/^(letter-\d+|daily-\d+)(--set[35])?$/.test(t.id))return t.id.replace(/--set[35]$/,'');return t.text.replace(/\s+/g,' ').trim()}
function unlocked(){return Math.min(new Set(state.entries.map(e=>taskKey(e.task))).size,100)}
function rewardInfo(i){return CATALOG[(i%10)*10+Math.floor(i/10)]||CATALOG[0]}
function rewardArt(i){const f=rewardInfo(i),src=typeof EMBEDDED_ASSETS!=='undefined'?EMBEDDED_ASSETS[f.asset]||f.asset:f.asset;return '<span class="catalog-art" style="--col:'+f.col+';--row:'+f.row+'"><img loading="lazy" src="'+src+'" alt="'+esc(f.name)+' 캐릭터"></span>'}
function card(i){const f=rewardInfo(i),owned=i<unlocked(),entry=owned?entryForCard(i):null;return '<button class="album-stamp '+(owned?'is-owned':i===unlocked()?'is-next':'is-waiting')+'" data-card="'+i+'" aria-label="'+(owned?'수집 완료 ':'미수집 ')+f.name+'"><span class="stamp-top"><b>No. '+String(i+1).padStart(3,'0')+'</b><span>'+esc(f.groupName)+'</span></span><span class="stamp-picture">'+rewardArt(i)+'</span><span class="stamp-caption"><strong>'+esc(f.name)+'</strong><small>'+(owned?'내 필사와 함께 도착했어요':(i+1)+'번째 새로운 원문을 완성하면 만나요')+'</small></span><span class="stamp-ticket">'+(owned?'COLLECTED · '+esc(entry.date):i===unlocked()?'NEXT DELIVERY':'WAITING FOR YOUR STORY')+'</span></button>'}
function collection(){const n=unlocked(),rows=Array.from({length:100},(_,i)=>i).filter(i=>(state.albumGroup==='all'||rewardInfo(i).group===state.albumGroup)&&(state.collectionFilter==='all'||(state.collectionFilter==='owned'?i<n:i>=n))),pages=Math.max(1,Math.ceil(rows.length/10));state.albumPage=Math.max(0,Math.min(state.albumPage,pages-1));return pageTitle('100 LITTLE POST FRIENDS','문장으로 채우는 100종 도감','열 개의 우편단, 서로 다른 백 명의 친구. 카드마다 내가 쓴 이야기가 연결돼요.')+'<section class="catalog-stage"><div class="catalog-cover"><div><span class="eyebrow">MY POSTAL ENCYCLOPEDIA</span><h2>다음 편지는 누구에게서 올까?</h2><p>새로운 원문을 완성할 때마다 친구 한 명이 도착해요.</p></div><div class="catalog-score"><strong>'+n+'</strong> / 100</div><div class="progress"><i style="width:'+n+'%"></i></div></div><div class="group-tabs" role="group" aria-label="우편단 선택">'+[{id:'all',name:'전체 친구'},...POST_GROUPS].map(g=>'<button data-group="'+g.id+'" aria-pressed="'+(state.albumGroup===g.id)+'">'+g.name+'</button>').join('')+'</div><div class="album-nav"><span>'+rows.length+'종 · '+(state.albumPage+1)+' / '+pages+'쪽</span><select id="album-filter" aria-label="수집 상태">'+[['all','모든 친구'],['owned','모은 친구'],['locked','기다리는 친구']].map(([v,l])=>'<option value="'+v+'" '+(v===state.collectionFilter?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="album-grid catalog-grid">'+(rows.length?rows.slice(state.albumPage*10,state.albumPage*10+10).map(card).join(''):'<p class="album-empty">아직 도착한 친구가 없어요. 첫 필사 사진을 보관해 보세요.</p>')+'</div><div class="library-pages"><button data-album-page="'+(state.albumPage-1)+'" '+(!state.albumPage?'disabled':'')+'>← 이전</button><span>'+String(state.albumPage+1).padStart(2,'0')+' / '+pages+'</span><button data-album-page="'+(state.albumPage+1)+'" '+(state.albumPage>=pages-1?'disabled':'')+'>다음 →</button></div><p class="note">100종은 모든 우편단을 합한 수예요. 같은 원문에서 분량만 바꿔 쓰면 사진은 쌓이고 카드는 중복 지급되지 않아요.</p></section>'}
function showCard(i,reward=false){if(!Number.isInteger(i)||i<0||i>=100)return;const f=rewardInfo(i),owned=i<unlocked(),entry=entryForCard(i);modal('<div class="card-detail collector-detail '+(reward?'reveal':'')+'"><span class="badge">'+(reward?'새 친구 도착!':owned?'MY COLLECTION':'WAITING FOR YOU')+'</span><div class="detail-art">'+rewardArt(i)+'</div><div class="eyebrow">No. '+String(i+1).padStart(3,'0')+' · '+esc(f.groupName)+'</div><h2>'+esc(f.name)+'</h2><p>'+esc(f.description)+'</p><div class="linked-story">'+(owned?'<small>이 친구를 데려온 필사</small><strong>'+esc(entry.task.title)+'</strong><p>'+esc(entry.answer)+'</p>':'서로 다른 원문 '+(i+1)+'편을 완성하면 만나요.')+'</div>'+(owned?'<button class="primary" data-record="'+esc(entry.id)+'">그날의 필사 사진 보기</button>':'<button class="primary" data-nav="write">오늘의 편지 쓰기</button>')+'</div>')}
function home(){const t=state.task,n=unlocked(),ready=isTextbook(t);return '<section class="hero"><div class="hero-copy"><span class="pill">교과서의 문장이 내 기록으로</span><h1>한 장 쓰고,<br><em>한 친구 만나고.</em></h1><p>국어·국어활동 원문을 종이에 옮겨 쓰고<br>사진과 낱말, 100종의 우편 친구를 모아요.</p><button class="primary" data-nav="'+(ready?'write':'teacher')+'">'+(ready?'오늘의 원문 쓰기':'교과서 원문 준비하기')+' →</button></div><img class="hero-image" src="office-v3.png" alt="문장 우체국"></section><section class="stats"><div class="stat"><strong>'+state.entries.length+'</strong><p>통의 필사 기록</p></div><div class="stat"><strong>'+n+' / 100</strong><p>수집한 친구</p></div><div class="stat"><strong>'+wordsCount()+'</strong><p>만난 낱말</p></div></section><div class="home-grid"><section class="panel"><h2>오늘의 교과서 원문</h2>'+(ready?'<div class="meta">'+t.grade+'학년 '+t.term+'학기 · '+esc(t.book)+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.text.slice(0,100))+'</p><p class="source">'+esc(t.source)+'</p><button class="text-link" data-nav="write">원문 펼치기 →</button>':'<p class="source-empty">아직 등록된 교과서 원문이 없어요.<br>선생님이 확인한 원문 자료집이나 활동 파일을 열어 주세요.</p><p class="note">창작 지문 365편은 기본 목록에서 제외했습니다. 학년별 365개, 총 1,460개 활동을 준비하고 있습니다. 현재 공개판에 내장된 원문은 0편입니다.</p><button class="secondary" data-nav="teacher">선생님 책상으로 →</button>')+'</section><section class="panel"><h2>'+(n<100?'다음에 만날 친구':'100종 수집 완료')+'</h2><div class="reward-preview">'+rewardArt(Math.min(n,99))+'<div><span class="eyebrow">'+esc(rewardInfo(Math.min(n,99)).groupName)+'</span><h3>'+esc(rewardInfo(Math.min(n,99)).name)+'</h3><button class="text-link" data-nav="collection">100종 도감 펼치기 →</button></div></div></section></div>'}
function filteredTasks(){const q=state.libraryQuery.trim().toLowerCase();return allTasks().filter(t=>t.grade===state.grade&&t.term===state.term&&(state.libraryCategory==='all'||t.book===state.libraryCategory)&&(!q||[t.title,t.text,t.word,t.unit,t.pages,t.author].join(' ').toLowerCase().includes(q)))}

async function localPDF(bookId){
 if(PDF_MEMORY.has(bookId))return PDF_MEMORY.get(bookId);
 return (await dbRun('books','readonly',s=>s.get(bookId)))?.blob||null;
}
async function openLocalPDF(bookId){
 if(pdfDoc&&pdfDocId===bookId)return pdfDoc;
 const blob=await localPDF(bookId);if(!blob)throw Error('이 책의 PDF를 먼저 연결해 주세요.');
 if(pdfLoadTask){await pdfLoadTask.destroy();pdfLoadTask=null;pdfDoc=null;pdfDocId=''}
 if(!pdfWorkerUrl){
  if(typeof PDF_WORKER_B64!=='undefined'){
   const bytes=Uint8Array.from(atob(PDF_WORKER_B64),c=>c.charCodeAt(0));pdfWorkerUrl=URL.createObjectURL(new Blob([bytes],{type:'text/javascript'}));
  }else pdfWorkerUrl=new URL('assets/pdf.worker.mjs',location.href).href;
 }
 PDFReaderSDK.GlobalWorkerOptions.workerSrc=pdfWorkerUrl;
 const data=new Uint8Array(await blob.arrayBuffer());
 pdfLoadTask=PDFReaderSDK.getDocument({data,useWasm:false,useWorkerFetch:false,isEvalSupported:false});
 pdfDoc=await pdfLoadTask.promise;

}
function renderLocalPassage(t,whole=false){
 const work=pdfRenderQueue.catch(()=>{}).then(async()=>{
  const doc=await openLocalPDF(t.bookId),page=await doc.getPage(t.pdfPage),vp=page.getViewport({scale:1.65}),canvas=document.createElement('canvas');
  canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  if(whole){page.cleanup();return canvas}
  const rows=t.clips.slice(0,pdfVariant(t).end),pad=4,minX=Math.min(...rows.map(r=>r[0]))*canvas.width,maxX=Math.max(...rows.map(r=>r[2]))*canvas.width;
  const widths=maxX-minX+2*pad,heights=rows.map(r=>(r[3]-r[1])*canvas.height+pad*2),result=document.createElement('canvas');
  result.width=Math.ceil(widths);result.height=Math.ceil(heights.reduce((a,b)=>a+b,0)+8*(rows.length-1));
  const ctx=result.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,result.width,result.height);let y=0;
  rows.forEach((r,i)=>{const x=r[0]*canvas.width-pad,top=r[1]*canvas.height-pad,w=(r[2]-r[0])*canvas.width+2*pad,h=heights[i];ctx.drawImage(canvas,x,top,w,h,x-minX+pad,y,w,h);y+=h+8});
  page.cleanup();canvas.width=1;canvas.height=1;return result;
 });
 pdfRenderQueue=work;return work;
}

function prepareWritingDesk() {
  const library = document.querySelector('.content-grid > aside');
  const paper = document.querySelector('.letter-paper');
  if (!library || !paper) return;
  const dayJump = library.querySelector('.day-jump');
  const timer = library.querySelector('.tipbox');
  const options = document.createElement('details');
  options.className = 'desk-options';
  const summary = document.createElement('summary');
  summary.textContent = '다른 편지 찾아보기';
  options.append(summary, ...Array.from(library.childNodes).filter(node => node !== dayJump && node !== timer));
  library.replaceChildren(...[dayJump, options, timer].filter(Boolean));

  const tools = document.createElement('div');
  tools.className = 'paper-toolbar';
  tools.innerHTML = '<strong>필사 원문</strong><button type="button" aria-pressed="false">집중해서 읽기 ↗</button>';
  paper.before(tools);
  const toggle = tools.querySelector('button');
  const closeFocus = () => {
    document.body.classList.remove('studio-focus');
    toggle.setAttribute('aria-pressed','false');
    toggle.textContent = '집중해서 읽기 ↗';
  };
  toggle.onclick = () => {
    if (document.body.classList.contains('studio-focus')) return closeFocus();
    document.body.classList.add('studio-focus');
    toggle.setAttribute('aria-pressed','true');
    toggle.textContent = '집중 화면 닫기 ×';
    tools.scrollIntoView({block:'start'});
  };
  tools.addEventListener('keydown', event => { if(event.key === 'Escape') closeFocus(); });
}

});
</script><script>(async()=>{try{state.db=await openDB();await refresh();state.grade=[3,4,5,6].includes(Number(setting('grade')))?Number(setting('grade')):4;state.term=Number(setting('term'))===2?2:1;state.task=resolveTask(setting('lastTask'))||allTasks().find(t=>t.grade===state.grade&&t.term===state.term)||emptyTask();const hash=location.hash.slice(1);if(hash.startsWith('activity=')){const p=new URLSearchParams(hash),ref=PDF_REF_MAP.get(p.get('activity'));if(!ref)throw new Error('활동 번호를 찾을 수 없어요.');state.task=pdfTask(ref,p.get('length'));state.view='write'}else if(hash.startsWith('letter=')){if(hash.length>60000)throw new Error('활동 링크가 너무 길어요.');const b64=hash.slice(7).replace(/-/g,'+').replace(/_/g,'/'),bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),t=JSON.parse(new TextDecoder().decode(bytes));if(!validTask(t))throw new Error('활동 링크 형식이 올바르지 않아요.');await acceptTask(t);state.view='write'}else if(hash.startsWith('task=')){const t=resolveTask(new URLSearchParams(hash).get('task'));if(t){state.task=t;state.view='write'}else{state.view='teacher';toast('이전 창작 활동 링크입니다. 선생님의 원문 활동 파일을 열어 주세요.')}}else if(['home','write','collection','archive','teacher'].includes(hash))state.view=hash;state.grade=state.task.grade;state.term=state.task.term;}catch(err){if(state.task.id==='empty'){state.task=TASKS.find(t=>t.grade===state.grade&&t.term===state.term)||emptyTask()}toast(err.message||'보관함을 열지 못했어요.')}render()})();
</script></body></html>
